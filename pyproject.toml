[project]
name = "hand-recognition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "av>=13.1.0",
    "mediapipe>=1.0.0",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pyautogui>=0.9.54",
    "streamlit>=1.40.0",
    "streamlit-webrtc>=0.47.0",
]

# Installed by `uv sync` and `uv run`, but not by anything installing the
# application - nobody running a gesture recogniser needs a linter.
[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "hypothesis>=6.130.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]

[project.scripts]
hand-recognition = "hand_recognition.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src/hand_recognition --cov-fail-under=90"
filterwarnings = ["error"]

[tool.coverage.run]
omit = ["src/hand_recognition/apps/*", "src/hand_recognition/model/*"]

[[tool.mypy.overrides]]
module = ["pyautogui", "mediapipe.*"]
ignore_missing_imports = true
