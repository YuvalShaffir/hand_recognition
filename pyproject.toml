[project]
name = "hand-recognition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "av>=13.1.0",
    "black>=26.5.1",
    "flake8>=7.3.0",
    "mediapipe>=1.0.0",
    "mypy>=2.3.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pyautogui>=0.9.54",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "streamlit>=1.40.0",
    "streamlit-webrtc>=0.47.0",
]

[project.scripts]
hand-recognition = "hand_recognition.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
