name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: format, lint, types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: black
        run: uv run black --check --diff .

      - name: flake8
        run: uv run flake8

      - name: mypy
        run: uv run mypy .

  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # `opencv-python` links against the system GL and glib libraries even
      # where nothing is drawn, and the GitHub Linux images ship neither.
      # Windows wheels carry their own.
      - name: Install OpenCV's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0t64

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # The suite needs no display, webcam, model file or network: mediapipe,
      # cv2, pyautogui and urllib are faked at their seams. The coverage gate
      # (90%, apps/ and model/ omitted) is in pyproject.toml.
      - name: pytest
        run: uv run pytest --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: warn
