version: 2

updates:
  # The model is fetched over the network and `.npz` recordings are parsed as
  # untrusted input, so the dependencies doing that parsing are worth
  # watching rather than pinning and forgetting.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["black", "flake8", "mypy", "pytest*", "hypothesis"]
      vision:
        patterns: ["mediapipe", "opencv-python", "numpy", "av"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
